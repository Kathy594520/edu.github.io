<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級自治小黑板</title>
    <!-- Tailwind CSS -->
    
    
    <!-- 設定 Import Map -->
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retro: {
                            bg: '#f0e6d2',      /* 泛黃紙張背景 */
                            paper: '#fffbf0',   /* 亮一點的紙 */
                            ink: '#2c2c2c',     /* 墨色 */
                            red: '#c0392b',     /* 印泥紅 */
                            blue: '#2980b9',    /* 鋼筆藍 */
                            green: '#27ae60',   /* 復古綠 */
                            board: '#2d3436',   /* 黑板深灰 */
                            wood: '#8e44ad',    /* 強調色 */
                            line: '#bdc3c7'     /* 筆記本線條 */
                        }
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'hard-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
                        'inner-hard': 'inset 2px 2px 0px 0px rgba(0,0,0,0.1)'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', '"Songti TC"', 'serif'],
                        mono: ['"Courier New"', 'monospace'],
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <script src="./routines_offline_assets/tailwind.js?v=20260627-fix-assets"></script>
    <script src="./routines_offline_assets/react.umd.js?v=20260627-fix-assets"></script>
    <script src="./routines_offline_assets/react-dom.umd.js?v=20260627-fix-assets"></script>
    <script src="./routines_offline_assets/babel.min.js?v=20260627-fix-assets"></script>

    <style>
        body {
            background-color: #f0e6d2;
            background-image: 
                linear-gradient(#e5dcc5 1px, transparent 1px),
                linear-gradient(90deg, #e5dcc5 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2c2c2c;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }

        /* 復古捲軸 */
        .retro-scrollbar::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        .retro-scrollbar::-webkit-scrollbar-track {
            background: #e0d0b0;
            border-left: 2px solid #2c2c2c;
        }
        .retro-scrollbar::-webkit-scrollbar-thumb {
            background: #2c2c2c;
            border: 2px solid #e0d0b0;
        }
        
        /* 拍立得效果 */
        .polaroid {
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transition: box-shadow 0.2s, transform 0.1s; /* 移除 width transition 以確保拖曳縮放流暢 */
            cursor: grab;
        }
        .polaroid:active {
            cursor: grabbing;
            z-index: 50 !important;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.4);
        }
        .polaroid:hover {
            z-index: 40;
        }

        /* 旋轉動畫 */
        @keyframes stamp-in {
            0% { opacity: 0; transform: scale(1.5) rotate(15deg); }
            100% { opacity: 1; transform: scale(1) rotate(-5deg); }
        }
        .animate-stamp {
            animation: stamp-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 雜訊濾鏡效果 */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* 修正文字垂直排版 */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .note-editor-empty:empty::before {
            content: attr(data-placeholder);
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
        }

        .blackboard-selectable,
        .blackboard-selectable * {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .blackboard-selectable::selection,
        .blackboard-selectable *::selection {
            background: rgba(241, 196, 15, 0.65);
            color: #ffffff;
        }

    </style>
</head>
<body>
    <div id="root"></div>
    <div class="noise-overlay"></div>

    <!-- 主程式邏輯 -->
    <script type="text/plain" id="app-code">
        const { useState, useEffect, useRef } = React;
        const createRoot = ReactDOM.createRoot;

        const makeIcon = (glyph) => ({ size = 24, className = "", style = {}, ...props }) => (
            <span
                {...props}
                aria-hidden="true"
                className={"inline-flex items-center justify-center leading-none select-none " + className}
                style={{
                    width: size,
                    height: size,
                    fontSize: Math.max(10, size * 0.8),
                    lineHeight: 1,
                    ...style
                }}
            >
                {glyph}
            </span>
        );

        const makeSvgIcon = (children) => ({ size = 24, className = "", style = {}, ...props }) => (
            <svg
                {...props}
                aria-hidden="true"
                viewBox="0 0 24 24"
                className={"inline-flex shrink-0 " + className}
                style={{
                    width: size,
                    height: size,
                    ...style
                }}
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
            >
                {children}
            </svg>
        );

        const Users = makeIcon('👥');
        const AlertCircle = makeIcon('!');
        const Settings = makeSvgIcon(<><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 0 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7.2 4.2l.1.1A1.7 1.7 0 0 0 9.2 4a1.7 1.7 0 0 0 1-1.6V2a2 2 0 0 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 20 6.2l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1H21a2 2 0 0 1 0 4h-.2a1.7 1.7 0 0 0-1.4.8Z" /></>);
        const RotateCcw = makeSvgIcon(<><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 3v6h6" /></>);
        const FileSpreadsheet = makeSvgIcon(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" /><path d="M14 2v6h6" /><path d="M8 13h8" /><path d="M8 17h8" /><path d="M8 9h2" /></>);
        const Star = makeIcon('★');
        const Heart = makeIcon('♥');
        const Plus = makeIcon('+');
        const Minus = makeIcon('−');
        const ChevronLeft = makeIcon('‹');
        const ChevronRight = makeIcon('›');
        const Check = makeIcon('✓');
        const Edit3 = makeIcon('✎');
        const Trash2 = makeIcon('🗑');
        const Sparkles = makeIcon('✦');
        const Utensils = makeIcon('🍽');
        const Award = makeIcon('🏅');
        const Eraser = makeSvgIcon(<><path d="m7 21-4-4 9.5-9.5a2.8 2.8 0 0 1 4 0l2 2a2.8 2.8 0 0 1 0 4L11 21Z" /><path d="m14 7 4 4" /><path d="M7 21h12" /></>);
        const ClipboardList = makeIcon('☰');
        const X = makeIcon('×');
        const Save = makeIcon('💾');
        const AlignVerticalJustifyStart = makeIcon('↕');
        const AlignHorizontalJustifyStart = makeIcon('↔');
        const AlertTriangle = makeIcon('⚠');
        const BookOpen = makeIcon('📖');
        const Clock = makeIcon('🕒');
        const Calendar = makeIcon('📅');
        const PenTool = makeIcon('✒');
        const ExternalLink = makeIcon('↗');
        const ImageIcon = makeIcon('🖼');
        const Paperclip = makeIcon('📎');
        const Upload = makeSvgIcon(<><path d="M16 16h2a4 4 0 0 0 .5-8 6 6 0 0 0-11.4-2A5 5 0 0 0 6 16h2" /><path d="M12 12v9" /><path d="m8 16 4-4 4 4" /></>);
        const Maximize = makeIcon('▢');
        const ZoomIn = makeIcon('＋');
        const ZoomOut = makeIcon('－');

        const formatMixedVerticalText = (text, writingMode) => {
            if (writingMode !== 'vertical') return text;
            return text.split(/([A-Za-z0-9]+(?:[-_./:：+－–—][A-Za-z0-9]+)*|[-_./:：+－–—])/g).map((part, index) => {
                if (/^[A-Za-z0-9]+(?:[-_./:：+－–—][A-Za-z0-9]+)*$/.test(part) || /^[-_./:：+－–—]$/.test(part)) {
                    return (
                        <span
                            key={`h-${index}`}
                            style={{
                                textCombineUpright: 'all',
                                WebkitTextCombine: 'horizontal',
                                margin: '2px 0',
                                fontFamily: '"Noto Sans TC", sans-serif'
                            }}
                        >
                            {part}
                        </span>
                    );
                }
                return part;
            });
        };

        const BlackboardFormattedContent = React.memo(({
            content,
            writingMode,
            fontType,
            showLineNumbers = true
        }) => {
            const noteLines = content.split('\n');

            return (
                <>
                    {noteLines.map((line, idx) => (
                    <div
                        key={idx}
                        className={`flex select-text ${writingMode === 'vertical' ? 'flex-row items-center gap-2 py-2 min-h-[1em]' : 'flex-row items-baseline gap-3 my-1'} text-white/95 font-medium`}
                        style={{ textShadow: '1px 1px 0px rgba(0,0,0,0.5)' }}
                    >
                        {showLineNumbers && (
                        <span
                            className={`text-[#f1c40f] font-black font-mono opacity-80 ${writingMode === 'vertical' ? 'mb-2' : ''}`}
                            style={writingMode === 'vertical' ? { writingMode: 'horizontal-tb' } : {}}
                        >
                        {idx + 1}.
                        </span>
                        )}
                        <span
                            className="whitespace-pre-wrap leading-relaxed tracking-wide select-text"
                            style={{
                                fontSize: fontType === 'zhuyin' ? '1.5em' : '1em',
                                lineHeight: fontType === 'zhuyin' ? '1.2' : '1.55',
                                textOrientation: 'mixed'
                            }}
                        >
                            {formatMixedVerticalText(line, writingMode)}
                        </span>
                    </div>
                    ))}
                </>
            );
        });

        const BlackboardNoteDisplay = React.memo(({
            content,
            writingMode,
            fontType,
            notebookFontSize,
            currentFontFamily
        }) => {
            const noteLines = content.split('\n');
            const copyText = noteLines.map((line, idx) => `${idx + 1}. ${line}`).join('\n');
            const copyBlackboardText = (event) => {
                const selectionText = String(window.getSelection?.() || '');
                const plainText = selectionText || copyText;
                if (!plainText) return;
                event.clipboardData.setData('text/plain', plainText);
                event.preventDefault();
            };

            return (
                <div
                className={`blackboard-selectable relative w-full h-full overflow-auto bg-transparent text-white/95 font-serif outline-none resize-none p-4 border border-white/10 select-text cursor-text ${writingMode === 'vertical' ? 'writing-vertical' : ''}`}
                onCopy={copyBlackboardText}
                style={{
                    fontFamily: currentFontFamily,
                    fontSize: `${notebookFontSize}px`,
                    writingMode: writingMode === 'vertical' ? 'vertical-rl' : 'horizontal-tb',
                    textOrientation: 'mixed',
                    unicodeBidi: 'plaintext'
                }}
                >
                    <BlackboardFormattedContent
                    content={content}
                    writingMode={writingMode}
                    fontType={fontType}
                    showLineNumbers={true}
                    />
                </div>
            );
        });

        // ---------------------------------------------------------------------------
        // 使用者設定區：直接鎖定注音字體網址 (.ttf/.woff)
        // ---------------------------------------------------------------------------
        const DEFAULT_ZHUYIN_FONT_URL = "https://raw.githubusercontent.com/Kathy594520/-/main/BpmfZihiOnly-R.ttf"; 

        const App = () => {
            // ---------------------------------------------------------------------------
            // 狀態設定
            // ---------------------------------------------------------------------------
            const DEFAULT_LATE_TIME = "07:50";

            const [students, setStudents] = useState([]);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [lateThreshold, setLateThreshold] = useState(() => localStorage.getItem('class_late_threshold') || DEFAULT_LATE_TIME);
            const [classNameTitle, setClassNameTitle] = useState(() => localStorage.getItem('class_title') || "班級自治小黑板");
            
            // UI 狀態
            const [showSettings, setShowSettings] = useState(false);
            const [showBatchEdit, setShowBatchEdit] = useState(false);
            const [batchInput, setBatchInput] = useState(""); 
            const [isEditingNote, setIsEditingNote] = useState(false);
            
            // 進階功能狀態：剪貼簿與拖曳
            const [leftPanelMode, setLeftPanelMode] = useState('students'); // 'students' | 'scrapbook' | 'homework'
            const [homeworkData, setHomeworkData] = useState(() => {
                try {
                    const saved = localStorage.getItem('class_homework_data');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && Array.isArray(parsed.assignments)) {
                            return {
                                assignments: parsed.assignments,
                                activeId: parsed.activeId ?? parsed.assignments[0]?.id ?? null
                            };
                        }
                    }
                } catch (e) {
                    console.error("Failed to load homework data", e);
                }
                return { assignments: [], activeId: null };
            });
            const [homeworkForm, setHomeworkForm] = useState({ title: "", dueDate: "", description: "" });
            const [scrapbookImages, setScrapbookImages] = useState(() => {
                try {
                    const saved = localStorage.getItem('class_scrapbook_images');
                    let images = saved ? JSON.parse(saved) : [];
                    // 資料遷移：確保所有舊圖片都有 x, y, scale 座標
                    return images.map(img => ({
                        ...img,
                        x: img.x ?? Math.random() * 100, // 預設隨機位置
                        y: img.y ?? Math.random() * 100,
                        scale: img.scale ?? 1 // 預設比例 1
                    }));
                } catch (e) {
                    console.error("Failed to load images", e);
                    return [];
                }
            });
            // 固定使用預設注音字體連結
            const customFontUrl = DEFAULT_ZHUYIN_FONT_URL;

            // 拖曳與互動狀態
            const [interactionState, setInteractionState] = useState({ 
                mode: null, // 'move' | 'resize' | null
                id: null 
            });
            const dragOffset = useRef({ x: 0, y: 0, startX: 0, startY: 0, initialScale: 1 });
            const scrapbookRef = useRef(null);

            // 確認視窗狀態
            const [confirmConfig, setConfirmConfig] = useState({ show: false, title: "", message: "", action: null, type: "danger" });
            
            // 模式與視圖
            const [checkInMode, setCheckInMode] = useState('attendance');
            const [viewMode, setViewMode] = useState('split');

            // 持久化設定
            const [writingMode, setWritingMode] = useState(() => localStorage.getItem('class_note_writing_mode') || 'horizontal');
            const [clockStyleIndex, setClockStyleIndex] = useState(() => parseInt(localStorage.getItem('class_clock_style') || '0', 10));
            const [splitRatio, setSplitRatio] = useState(() => parseFloat(localStorage.getItem('class_split_ratio') || '50'));
            const [notebookFontSize, setNotebookFontSize] = useState(() => parseInt(localStorage.getItem('class_notebook_font_size') || '32', 10));
            const [fontType, setFontType] = useState(() => localStorage.getItem('class_font_type') || 'sans');
            
            // 聯絡簿資料
            const [notesData, setNotesData] = useState(() => {
                const saved = localStorage.getItem('class_notes_data');
                if (saved) { try { return JSON.parse(saved); } catch (e) { console.error(e); } }
                const todayKey = new Date().toISOString().split('T')[0];
                return { [todayKey]: "\n\n\n\n\n" };
            });

            const [notebookDate, setNotebookDate] = useState(new Date());
            const splitContainerRef = useRef(null);
            const noteEditorRef = useRef(null);
            const fileInputRef = useRef(null);
            const backupFileInputRef = useRef(null);

            // ---------------------------------------------------------------------------
            // 字體與樣式系統
            // ---------------------------------------------------------------------------
            
            // 動態注入注音字體
            useEffect(() => {
                if (customFontUrl) {
                    const styleId = 'custom-zhuyin-font-style';
                    let styleTag = document.getElementById(styleId);
                    if (!styleTag) {
                        styleTag = document.createElement('style');
                        styleTag.id = styleId;
                        document.head.appendChild(styleTag);
                    }
                    styleTag.textContent = `
                        @font-face {
                            font-family: 'ZhuyinCustom';
                            src: url('${customFontUrl}') format('truetype');
                            font-display: swap;
                        }
                    `;
                }
            }, [customFontUrl]);

            const getFontFamily = (type) => {
                switch (type) {
                case 'zhuyin': return "'ZhuyinCustom', 'Noto Serif TC', serif";
                case 'kai': return "'標楷體', 'DFKai-SB', 'KaiTi', 'BiauKai', serif";
                case 'rounded': return "'Varela Round', 'M PLUS Rounded 1c', 'Microsoft JhengHei', '微軟正黑體', sans-serif";
                case 'sans': default: return "'Noto Sans TC', sans-serif";
                }
            };
            const currentFontFamily = getFontFamily(fontType);

            // 標準時鐘樣式
            const CLOCK_STYLES = [
                { id: 'chalk', name: '粉筆白', text: 'text-[#2c2418]', ring: '#5d4037', bg: '#fcfbf2' },
                { id: 'slate', name: '黑板綠', text: 'text-[#1f3a34]', ring: '#2f4f46', bg: '#eaf0e8' },
                { id: 'amber', name: '粉筆黃', text: 'text-[#5d4215]', ring: '#8a6a24', bg: '#fff4c7' },
                { id: 'blue', name: '值日藍', text: 'text-[#24465a]', ring: '#31566b', bg: '#e5eef2' },
                { id: 'red', name: '印泥紅', text: 'text-[#743025]', ring: '#8b3f2f', bg: '#f4dfd6' }
            ];
            const currentClockStyle = CLOCK_STYLES[clockStyleIndex % CLOCK_STYLES.length];

            // ---------------------------------------------------------------------------
            // 邏輯處理
            // ---------------------------------------------------------------------------

            useEffect(() => {
                const savedStudents = localStorage.getItem('class_students_v2'); 
                if (savedStudents) {
                try {
                    const parsed = JSON.parse(savedStudents);
                    if (Array.isArray(parsed)) {
                        const uniqueStudents = Array.from(new Map(parsed.map(item => [item.id, item])).values());
                        uniqueStudents.sort((a, b) => a.id - b.id);
                        setStudents(uniqueStudents);
                    } else { setStudents([]); }
                } catch(e) { setStudents([]); }
                } else { setStudents([]); }
            }, []);

            useEffect(() => { localStorage.setItem('class_students_v2', JSON.stringify(students)); }, [students]);
            useEffect(() => { localStorage.setItem('class_title', classNameTitle); }, [classNameTitle]);
            useEffect(() => { localStorage.setItem('class_notes_data', JSON.stringify(notesData)); }, [notesData]);
            useEffect(() => { localStorage.setItem('class_note_writing_mode', writingMode); }, [writingMode]);
            useEffect(() => { localStorage.setItem('class_split_ratio', splitRatio); }, [splitRatio]);
            useEffect(() => { localStorage.setItem('class_notebook_font_size', notebookFontSize); }, [notebookFontSize]);
            useEffect(() => { localStorage.setItem('class_font_type', fontType); }, [fontType]);
            useEffect(() => { localStorage.setItem('class_clock_style', clockStyleIndex); }, [clockStyleIndex]);
            useEffect(() => { localStorage.setItem('class_homework_data', JSON.stringify(homeworkData)); }, [homeworkData]);
            // 移除 font URL 的 local storage 寫入，因為已寫死
            
            // 剪貼簿存儲
            useEffect(() => { 
                try {
                    localStorage.setItem('class_scrapbook_images', JSON.stringify(scrapbookImages)); 
                } catch (e) {
                    console.warn("Storage full, images not saved to disk.");
                }
            }, [scrapbookImages]);

            const saveLateThreshold = () => {
                localStorage.setItem('class_late_threshold', lateThreshold);
            };

            // 全局貼上監聽
            useEffect(() => {
                const handlePaste = (e) => {
                    if (leftPanelMode !== 'scrapbook') return;
                    const items = e.clipboardData.items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) {
                            const blob = items[i].getAsFile();
                            processImageFile(blob);
                        }
                    }
                };
                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, [leftPanelMode]);

            useEffect(() => {
                const timer = setInterval(() => {
                const now = new Date();
                setCurrentTime(now);
                checkLateStatus(now);
                }, 1000);
                return () => clearInterval(timer);
            }, [lateThreshold]);

            const checkLateStatus = (now) => {
                const [h, m] = lateThreshold.split(':').map(Number);
                const thresholdDate = new Date(now);
                thresholdDate.setHours(h, m, 0, 0);
                const resetDate = new Date(now);
                resetDate.setHours(17, 0, 0, 0);
                const isLateAlertPeriod = now >= thresholdDate && now < resetDate;

                setStudents(prev => prev.map(s => {
                if (s.status === 'idle' && isLateAlertPeriod) return { ...s, status: 'late_absent' };
                if (s.status === 'late_absent' && !isLateAlertPeriod) return { ...s, status: 'idle' };
                return s;
                }));
            };

            const handleStudentClick = (id) => {
                setStudents(prev => prev.map(s => {
                if (s.id !== id) return s;
                
                switch (checkInMode) {
                    case 'attendance': {
                    const now = new Date();
                    const timeString = now.toTimeString().slice(0, 5);
                    const [h, m] = lateThreshold.split(':').map(Number);
                    const thresholdDate = new Date(now);
                    thresholdDate.setHours(h, m, 0, 0);
                    const isLate = now >= thresholdDate;
                    const resetDate = new Date(now);
                    resetDate.setHours(17, 0, 0, 0);
                    const isLateAlertPeriod = now >= thresholdDate && now < resetDate;

                    if (s.status === 'present' || s.status === 'late_arrived') {
                        return { ...s, status: isLateAlertPeriod ? 'late_absent' : 'idle', arrivalTime: null };
                    }
                    return { ...s, status: isLate ? 'late_arrived' : 'present', arrivalTime: timeString };
                    }
                    case 'brushing': return { ...s, brushing: !s.brushing };
                    case 'lunch': return { ...s, lunch: !s.lunch };
                    case 'duty': return { ...s, isDuty: !s.isDuty };
                    case 'correction': return { ...s, correction: !s.correction }; 
                    default: return s;
                }
                }));
            };

            const updateStudentData = (originalId, field, value) => {
                setStudents(prev => {
                    const newList = prev.map(s => {
                        if (s.id !== originalId) return s;
                        if (field === 'name') return { ...s, name: value };
                        if (field === 'id') {
                            const newId = parseInt(value, 10);
                            if (!isNaN(newId) && newId > 0) return { ...s, id: newId };
                        }
                        return s;
                    });
                    return newList.sort((a, b) => a.id - b.id);
                });
            };

            const homeworkAssignments = homeworkData.assignments || [];
            const currentHomework = homeworkAssignments.find(item => item.id === homeworkData.activeId) || homeworkAssignments[0] || null;
            const submittedCount = currentHomework ? students.filter(student => currentHomework.submissions?.[student.id]).length : 0;

            const createHomeworkAssignment = () => {
                const title = homeworkForm.title.trim();
                if (!title) return;

                const id = Date.now();
                const nextItem = {
                    id,
                    title,
                    dueDate: homeworkForm.dueDate,
                    description: homeworkForm.description.trim(),
                    submissions: {},
                    createdAt: new Date().toISOString()
                };

                setHomeworkData(prev => ({
                    assignments: [nextItem, ...prev.assignments],
                    activeId: id
                }));
                setHomeworkForm({ title: "", dueDate: "", description: "" });
            };

            const removeHomeworkAssignment = (id) => {
                setHomeworkData(prev => {
                    const assignments = prev.assignments.filter(item => item.id !== id);
                    const nextActiveId = prev.activeId === id ? (assignments[0]?.id ?? null) : prev.activeId;
                    return { assignments, activeId: nextActiveId };
                });
            };

            const toggleHomeworkSubmission = (studentId) => {
                if (!currentHomework) return;
                setHomeworkData(prev => ({
                    ...prev,
                    assignments: prev.assignments.map(item => {
                        if (item.id !== currentHomework.id) return item;
                        const submissions = { ...(item.submissions || {}) };
                        submissions[studentId] = !submissions[studentId];
                        return { ...item, submissions };
                    })
                }));
            };

            const clearHomeworkSubmissions = () => {
                if (!currentHomework) return;
                setHomeworkData(prev => ({
                    ...prev,
                    assignments: prev.assignments.map(item => item.id === currentHomework.id ? { ...item, submissions: {} } : item)
                }));
            };

            // ---------------------------------------------------------------------------
            // 剪貼簿邏輯
            // ---------------------------------------------------------------------------
            
            const processImageFile = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const randomX = 20 + Math.random() * 200;
                    const randomY = 20 + Math.random() * 200;
                    
                    const newImage = {
                        id: Date.now(),
                        src: e.target.result,
                        rotation: Math.random() * 10 - 5,
                        timestamp: new Date().toLocaleString(),
                        x: randomX,
                        y: randomY,
                        scale: 1
                    };
                    setScrapbookImages(prev => [...prev, newImage]);
                };
                reader.readAsDataURL(file);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) processImageFile(file);
                e.target.value = null; // 重置 input
            };

            const removeImage = (id) => {
                setScrapbookImages(prev => prev.filter(img => img.id !== id));
            };

            const updateImageScale = (id, delta) => {
                setScrapbookImages(prev => prev.map(img => {
                    if (img.id === id) {
                        const newScale = Math.max(0.5, Math.min(3.0, (img.scale || 1) + delta));
                        return { ...img, scale: newScale };
                    }
                    return img;
                }));
            };

            // 拖曳處理邏輯 (移動)
            const onMouseDownMove = (e, id, currentX, currentY) => {
                e.stopPropagation();
                if (leftPanelMode !== 'scrapbook') return;
                
                dragOffset.current = {
                    x: e.clientX - currentX,
                    y: e.clientY - currentY
                };
                setInteractionState({ mode: 'move', id: id });
            };

            // 拖曳處理邏輯 (縮放)
            const onMouseDownResize = (e, id, currentScale) => {
                e.stopPropagation();
                e.preventDefault();
                if (leftPanelMode !== 'scrapbook') return;

                dragOffset.current = {
                    startX: e.clientX,
                    startY: e.clientY,
                    initialScale: currentScale
                };
                setInteractionState({ mode: 'resize', id: id });
            };

            const onMouseMoveScrapbook = (e) => {
                if (!interactionState.mode) return;
                
                if (interactionState.mode === 'move') {
                    // 計算新位置
                    const newX = e.clientX - dragOffset.current.x;
                    const newY = e.clientY - dragOffset.current.y;

                    setScrapbookImages(prev => prev.map(img => 
                        img.id === interactionState.id ? { ...img, x: newX, y: newY } : img
                    ));
                } else if (interactionState.mode === 'resize') {
                    // 計算新比例
                    const deltaX = e.clientX - dragOffset.current.startX;
                    const scaleChange = deltaX * 0.005; // 調整靈敏度
                    const newScale = Math.max(0.5, Math.min(3.0, dragOffset.current.initialScale + scaleChange));

                    setScrapbookImages(prev => prev.map(img => 
                        img.id === interactionState.id ? { ...img, scale: newScale } : img
                    ));
                }
            };

            const onMouseUpScrapbook = () => {
                if (!interactionState.mode) return;
                setInteractionState({ mode: null, id: null });
            };


            const executeConfirmAction = () => {
                if (confirmConfig.action) { confirmConfig.action(); }
                setConfirmConfig({ ...confirmConfig, show: false });
            };

            const cancelConfirmAction = () => { setConfirmConfig({ ...confirmConfig, show: false }); };

            const confirmRemoveStudent = (e, id) => {
                e.stopPropagation();
                setConfirmConfig({
                show: true,
                title: "移除學生",
                message: `確定要將座號 ${id} 從名冊中移除嗎？此操作不可逆。`,
                type: "danger",
                action: () => { setStudents(prev => prev.filter(s => s.id !== id)); }
                });
            };

            const confirmClearNote = () => {
                setConfirmConfig({
                show: true,
                title: "黑板擦",
                message: "確定要擦掉所有板書嗎？",
                type: "warning",
                action: () => { updateCurrentNote("\n\n\n\n\n"); }
                });
            };

            const confirmResetMode = () => {
                setConfirmConfig({
                show: true,
                title: `重置${getModeName(checkInMode)}`,
                message: `確定要重置所有學生的「${getModeName(checkInMode)}」紀錄嗎？`,
                type: "warning",
                action: () => {
                    setStudents(prev => prev.map(s => {
                    switch (checkInMode) {
                        case 'attendance': return { ...s, status: s.status === 'empty' ? 'empty' : 'idle', arrivalTime: null };
                        case 'brushing': return { ...s, brushing: false };
                        case 'lunch': return { ...s, lunch: false };
                        case 'duty': return { ...s, isDuty: false };
                        case 'correction': return { ...s, correction: false };
                        default: return s;
                    }
                    }));
                }
                });
            };

            const openBatchEdit = () => {
                const textList = students.map(s => `${s.id} ${s.name}`).join('\n');
                setBatchInput(textList);
                setShowBatchEdit(true);
            };

            const saveBatchEdit = () => {
                const lines = batchInput.split(/\r\n|\n|\r/).filter(line => line.trim() !== '');
                const newStudents = [];
                const usedIds = new Set();

                lines.forEach(line => {
                    const match = line.trim().match(/^(\d+)[\s,，.]+(.*)$/);
                    let id, name;

                    if (match) {
                        id = parseInt(match[1], 10);
                        name = match[2].trim();
                    } else { return; }

                    if (!isNaN(id) && id > 0 && name) {
                        if (usedIds.has(id)) {
                            const index = newStudents.findIndex(s => s.id === id);
                            if (index !== -1) newStudents[index].name = name;
                        } else {
                            newStudents.push({
                                id: id, name: name,
                                status: 'idle', arrivalTime: null, brushing: false, lunch: false, isDuty: false, correction: false
                            });
                            usedIds.add(id);
                        }
                    }
                });

                if (newStudents.length > 0) {
                    newStudents.sort((a, b) => a.id - b.id);
                    setStudents(prev => {
                        const prevMap = new Map(prev.map(s => [s.id, s]));
                        return newStudents.map(newS => {
                            const oldS = prevMap.get(newS.id);
                            if (oldS) return { ...oldS, name: newS.name };
                            return newS;
                        });
                    });
                    setShowBatchEdit(false);
                } else {
                    alert("名冊格式錯誤。\n請使用：[座號] [姓名]\n例如：1 王小明");
                }
            };

            const addStudent = () => {
                setStudents(prev => {
                    const maxId = prev.length > 0 ? Math.max(...prev.map(s => s.id)) : 0;
                    return [...prev, { 
                        id: maxId + 1, name: "", 
                        status: 'idle', arrivalTime: null, brushing: false, lunch: false, isDuty: false, correction: false
                    }].sort((a, b) => a.id - b.id);
                });
            };

            const getModeName = (mode) => {
                const map = { 
                attendance: '出勤點名', 
                brushing: '潔牙檢查', 
                lunch: '午餐整潔', 
                duty: '值日輪值',
                correction: '作業訂正'
                };
                return map[mode];
            };

            const handleExportCSV = () => {
                const dateStr = currentTime.toLocaleDateString('zh-TW');
                let csvContent = "\ufeff日期,座號,姓名,打卡狀態,到校時間,潔牙,午餐整理,值日生,作業訂正\n";
                const statusMap = { 'idle': '未到', 'present': '準時', 'late_absent': '遲到未到', 'late_arrived': '遲到已到' };
                
                const sortedStudents = [...students].sort((a, b) => a.id - b.id);
                
                sortedStudents.forEach(s => {
                csvContent += `${dateStr},${s.id},${s.name},${statusMap[s.status] || '未到'},${s.arrivalTime || '--'},${s.brushing?'V':''},${s.lunch?'V':''},${s.isDuty?'V':''},${s.correction?'V':''}\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `班級紀錄_${dateStr.replace(/\//g, '-')}.csv`;
                link.click();
            };

            const clampNumber = (value, min, max, fallback) => {
                const number = Number(value);
                if (!Number.isFinite(number)) return fallback;
                return Math.max(min, Math.min(max, number));
            };

            const sanitizeBackupFileName = (name) => {
                const safeName = String(name || '班級自治小黑板').trim().replace(/[\\/:*?"<>|]/g, '-');
                return safeName || '班級自治小黑板';
            };

            const normalizeBackupData = (payload) => {
                const data = payload?.data || payload;
                if (!data || !Array.isArray(data.students)) {
                    throw new Error('這不是小黑板匯出的 JSON 備份檔。');
                }

                return {
                    students: data.students,
                    classNameTitle: typeof data.classNameTitle === 'string' ? data.classNameTitle : '班級自治小黑板',
                    lateThreshold: typeof data.lateThreshold === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(data.lateThreshold) ? data.lateThreshold : DEFAULT_LATE_TIME,
                    notesData: data.notesData && typeof data.notesData === 'object' && !Array.isArray(data.notesData) ? data.notesData : {},
                    writingMode: data.writingMode === 'vertical' ? 'vertical' : 'horizontal',
                    clockStyleIndex: clampNumber(data.clockStyleIndex, 0, CLOCK_STYLES.length - 1, 0),
                    splitRatio: clampNumber(data.splitRatio, 20, 80, 50),
                    notebookFontSize: clampNumber(data.notebookFontSize, 16, 72, 32),
                    fontType: ['zhuyin', 'kai', 'rounded', 'sans'].includes(data.fontType) ? data.fontType : 'sans',
                    homeworkData: data.homeworkData && Array.isArray(data.homeworkData.assignments) ? data.homeworkData : { assignments: [], activeId: null },
                    scrapbookImages: Array.isArray(data.scrapbookImages) ? data.scrapbookImages : [],
                    checkInMode: ['attendance', 'brushing', 'lunch', 'duty', 'correction'].includes(data.checkInMode) ? data.checkInMode : 'attendance',
                    leftPanelMode: ['students', 'scrapbook', 'homework'].includes(data.leftPanelMode) ? data.leftPanelMode : 'students',
                    viewMode: ['split', 'checkin', 'notebook'].includes(data.viewMode) ? data.viewMode : 'split'
                };
            };

            const handleExportJSON = () => {
                const exportedAt = new Date().toISOString();
                const backup = {
                    app: 'class-autonomy-blackboard',
                    schemaVersion: 1,
                    exportedAt,
                    data: {
                        students,
                        classNameTitle,
                        lateThreshold,
                        notesData,
                        writingMode,
                        clockStyleIndex,
                        splitRatio,
                        notebookFontSize,
                        fontType,
                        homeworkData,
                        scrapbookImages,
                        checkInMode,
                        leftPanelMode,
                        viewMode
                    }
                };

                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8;' });
                const link = document.createElement("a");
                const stamp = exportedAt.slice(0, 19).replace(/[T:]/g, '-');
                link.href = URL.createObjectURL(blob);
                link.download = `${sanitizeBackupFileName(classNameTitle)}_小黑板備份_${stamp}.json`;
                link.click();
                URL.revokeObjectURL(link.href);
            };

            const applyImportedBackup = (data) => {
                setStudents(data.students);
                setClassNameTitle(data.classNameTitle);
                setLateThreshold(data.lateThreshold);
                setNotesData(data.notesData);
                setWritingMode(data.writingMode);
                setClockStyleIndex(data.clockStyleIndex);
                setSplitRatio(data.splitRatio);
                setNotebookFontSize(data.notebookFontSize);
                setFontType(data.fontType);
                setHomeworkData(data.homeworkData);
                setScrapbookImages(data.scrapbookImages);
                setCheckInMode(data.checkInMode);
                setLeftPanelMode(data.leftPanelMode);
                setViewMode(data.viewMode);
                setShowSettings(false);
                window.alert('JSON 備份已匯入完成。');
            };

            const handleImportJSON = (event) => {
                const file = event.target.files?.[0];
                event.target.value = null;
                if (!file) return;

                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const payload = JSON.parse(reader.result);
                        const data = normalizeBackupData(payload);
                        setConfirmConfig({
                            show: true,
                            title: "匯入 JSON 備份",
                            message: `確定要匯入「${file.name}」嗎？目前這台載具上的名冊、聯絡簿、作業、剪貼簿與版面設定會被備份檔覆蓋。`,
                            type: "warning",
                            action: () => applyImportedBackup(data)
                        });
                    } catch (error) {
                        window.alert(error.message || 'JSON 匯入失敗，請確認檔案格式。');
                    }
                };
                reader.onerror = () => window.alert('讀取 JSON 檔案失敗，請重新選擇檔案。');
                reader.readAsText(file, 'utf-8');
            };

            const getNoteDateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            const currentNoteKey = getNoteDateKey(notebookDate);
            const currentNoteContent = notesData[currentNoteKey] || ""; 
            const updateCurrentNote = (content) => setNotesData(prev => ({ ...prev, [currentNoteKey]: content }));
            
            const toggleClockStyle = () => setClockStyleIndex(prev => (prev + 1) % CLOCK_STYLES.length);
            
            // 修正Grid邏輯：復古風格稍微寬一點
            const getGridColsClass = () => {
                const n = students.length;
                if (n === 0) return "grid-cols-1"; 
                if (n <= 30) return "grid-cols-5";
                if (n <= 42) return "grid-cols-6";
                if (n <= 56) return "grid-cols-8";
                return "grid-cols-10";
            };

            const handleDragStart = (e) => { e.preventDefault(); document.addEventListener('mousemove', handleDragMove); document.addEventListener('mouseup', handleDragEnd); };
            const handleDragMove = (e) => {
                if (splitContainerRef.current) {
                const rect = splitContainerRef.current.getBoundingClientRect();
                const newRatio = Math.max(20, Math.min(((e.clientX - rect.left) / rect.width) * 100, 80));
                setSplitRatio(newRatio);
                }
            };
            const handleDragEnd = () => { document.removeEventListener('mousemove', handleDragMove); document.removeEventListener('mouseup', handleDragEnd); };

            useEffect(() => {
                if (!isEditingNote || !noteEditorRef.current) return;
                noteEditorRef.current.focus();
            }, [isEditingNote, currentNoteKey]);

            // ---------------------------------------------------------------------------
            // 復古 UI 元件
            // ---------------------------------------------------------------------------

            return (
                <div 
                    className="h-screen flex flex-col overflow-hidden relative selection:bg-retro-red selection:text-white font-serif"
                    onMouseMove={onMouseMoveScrapbook}
                    onMouseUp={onMouseUpScrapbook}
                >
                
                {/* 裝飾：四周的暗角效果 */}
                <div className="absolute inset-0 pointer-events-none shadow-[inset_0_0_100px_rgba(44,44,44,0.15)] z-40"></div>

                {/* 頂部導航列：木製標尺與標籤風格 */}
                <div className="bg-[#f7f1e3] border-2 border-[#5d4037] shadow-hard px-4 py-3 flex justify-between items-center z-20 shrink-0 mx-4 mt-4 mb-2 rounded-[1.5rem]">
                    
                    {/* 左側：班級名稱與模式切換 */}
                    <div className="flex items-center gap-4">
                        <div className="flex items-center gap-3 relative group min-w-[200px]">
                            <div className="absolute inset-0 bg-[#f1c40f] opacity-20 rotate-[-1deg] transform scale-105 -z-10 skew-x-12"></div>
                            <div className="p-1 border-2 border-[#5d4037] bg-[#fcfbf9] flex items-center justify-center shrink-0 rounded-lg">
                                <Users className="w-5 h-5 text-retro-ink" strokeWidth={2.5} />
                            </div>
                            <input 
                            type="text" 
                            value={classNameTitle} 
                            onChange={(e) => setClassNameTitle(e.target.value)}
                            placeholder="輸入班級..."
                            className="text-2xl font-black text-retro-ink bg-transparent outline-none w-full placeholder-gray-400 font-serif tracking-widest select-text"
                            style={{ fontFamily: '"Noto Serif TC", serif' }}
                            />
                        </div>

                        {/* 左側面板切換按鈕 (名冊/剪貼簿) */}
                        <div className="flex bg-[#fcfbf9] border-2 border-[#5d4037] rounded-xl shadow-sm overflow-hidden ml-2">
                            <button 
                                onClick={() => setLeftPanelMode('students')}
                                className={`px-3 py-1 text-xs font-bold font-mono transition-colors flex items-center gap-1 ${leftPanelMode === 'students' ? 'bg-retro-paper text-retro-ink' : 'text-retro-ink hover:bg-gray-100'}`}
                            >
                                <Users className="w-3 h-3" /> 名冊
                            </button>
                            <div className="w-[1px] bg-retro-ink"></div>
                            <button 
                                onClick={() => setLeftPanelMode('scrapbook')}
                                className={`px-3 py-1 text-xs font-bold font-mono transition-colors flex items-center gap-1 ${leftPanelMode === 'scrapbook' ? 'bg-retro-paper text-retro-ink' : 'text-retro-ink hover:bg-gray-100'}`}
                            >
                                <ImageIcon className="w-3 h-3" /> 剪貼
                            </button>
                            <div className="w-[1px] bg-retro-ink"></div>
                            <button 
                                onClick={() => setLeftPanelMode('homework')}
                                className={`px-3 py-1 text-xs font-bold font-mono transition-colors flex items-center gap-1 ${leftPanelMode === 'homework' ? 'bg-retro-paper text-retro-ink' : 'text-retro-ink hover:bg-gray-100'}`}
                            >
                                <ClipboardList className="w-3 h-3" /> 作業繳交
                            </button>
                        </div>
                    </div>

                    {/* 中間：點名模式 (僅在名冊模式顯示) */}
                    {leftPanelMode === 'students' && (
                        <div className="flex gap-2 overflow-x-auto no-scrollbar mx-4">
                            <ModeButton active={checkInMode === 'attendance'} onClick={() => setCheckInMode('attendance')} icon={<Users size={20} />} label="點名簿" color="border-[#2f2a24] bg-[#f4d35e] text-[#2c2418]" />
                            <ModeButton active={checkInMode === 'brushing'} onClick={() => setCheckInMode('brushing')} icon={<Sparkles size={20} />} label="潔牙卡" color="border-[#3f5f4b] bg-[#e8efe6] text-[#263b2d]" />
                            <ModeButton active={checkInMode === 'lunch'} onClick={() => setCheckInMode('lunch')} icon={<Utensils size={20} />} label="午餐值日" color="border-[#8b3f2f] bg-[#f4e1d2] text-[#5a2a20]" />
                            <ModeButton active={checkInMode === 'duty'} onClick={() => setCheckInMode('duty')} icon={<Award size={20} />} label="值日生" color="border-[#5d4037] bg-[#e8dccb] text-[#3e2723]" />
                            <ModeButton active={checkInMode === 'correction'} onClick={() => setCheckInMode('correction')} icon={<BookOpen size={20} />} label="訂正欄" color="border-[#31566b] bg-[#dfeaf0] text-[#203845]" />
                        </div>
                    )}
                    {leftPanelMode === 'scrapbook' && (
                        <div className="flex-1 flex justify-center items-center text-retro-ink/50 font-serif font-bold italic">
                            <span className="bg-white px-4 py-1 border-b-2 border-retro-ink/20">SCRAPBOOK - 支持貼上(Ctrl+V)與拖拉縮放</span>
                        </div>
                    )}

                    {/* 右側：工具箱 (筆盒風格) */}
                    <div className="flex items-center gap-4 shrink-0">
                        {/* 視圖切換 */}
                        <div className="flex items-center bg-[#5d4037] p-1 gap-1 border-2 border-[#3e2723] hidden md:flex rounded-xl shadow-hard-sm">
                        {['split', 'checkin', 'notebook'].map(m => (
                            <button key={m} onClick={() => setViewMode(m)} className={`px-3 py-1 text-xs font-bold font-mono transition-all border border-transparent ${viewMode === m ? 'bg-[#f1c40f] text-retro-ink border-black shadow-[2px_2px_0_0_white] drop-shadow-[0_1px_0_rgba(255,255,255,0.35)]' : 'text-white hover:text-[#f1c40f] hover:drop-shadow-[0_1px_0_rgba(255,255,255,0.35)]'}`}>
                            {m === 'split' ? '分屏' : m === 'checkin' ? '左屏' : '黑板'}
                            </button>
                        ))}
                        </div>

                        <div className="w-0.5 h-8 bg-retro-ink/20 mx-1"></div>

                        <div className="flex items-center gap-2">
                        <input
                            type="file"
                            ref={backupFileInputRef}
                            accept="application/json,.json"
                            className="hidden"
                            onChange={handleImportJSON}
                        />
                        <ToolButton onClick={() => setShowSettings(!showSettings)} icon={<Settings size={28} />} title="設定" />
                        <ToolButton onClick={handleExportCSV} icon={<FileSpreadsheet size={28} />} title="匯出報表" />
                        <ToolButton onClick={handleExportJSON} icon={<Save size={28} />} title="匯出 JSON" />
                        <ToolButton onClick={() => backupFileInputRef.current?.click()} icon={<Upload size={28} />} title="匯入 JSON" />
                        <ToolButton onClick={confirmResetMode} icon={<RotateCcw size={28} />} title="重置狀態" danger />
                        </div>
                    </div>
                </div>

                {/* 側邊設定面板：檔案夾風格 */}

                            <span className="bg-retro-ink text-white px-2 py-1 text-sm font-mono">CONFIG</span> 
                            系統設定
                        </h3>
                        <button onClick={() => setShowSettings(false)} className="w-8 h-8 flex items-center justify-center border-2 border-[#5d4037] bg-white hover:bg-[#c0392b] hover:text-white transition-colors rounded-full">✕</button>

                            <div className="absolute -top-3 left-3 bg-[#c0392b] text-white px-2 text-xs font-mono rounded-full">TIME & FONT</div>
