                                <div>
                                    <label className="block text-sm font-bold text-retro-ink mb-1 font-serif">遲到界線</label>
                                    <input type="time" value={lateThreshold} onChange={(e) => setLateThreshold(e.target.value)} className="w-full px-2 py-2 bg-retro-bg border-b-2 border-retro-ink outline-none font-mono text-lg focus:bg-white transition-colors" />
                                </div>
                                <button onClick={saveLateThreshold} className="w-full py-2 bg-[#c0392b] text-white border-2 border-[#8b2e22] font-bold hover:bg-[#a93226] shadow-hard-sm flex items-center justify-center gap-2 rounded-xl">
                                    <Save className="w-4 h-4" /> 儲存設定
                                </button>
                                <div>
                                    <label className="block text-sm font-bold text-retro-ink mb-1 font-serif">黑板字體風格</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['sans', 'kai', 'rounded', 'zhuyin'].map(ft => (
                                            <button key={ft} onClick={() => setFontType(ft)} className={`py-1 text-xs font-bold border-2 transition-all rounded-lg ${fontType === ft ? 'bg-[#f7f1e3] text-retro-ink border-[#5d4037]' : 'bg-white text-retro-ink border-[#5d4037] hover:bg-gray-100'}`}>
                                            {ft === 'sans' ? '黑體' : ft === 'kai' ? '楷體' : ft === 'rounded' ? '圓體' : '注音體'}
                                            </button>
                                        ))}
                                    </div>
                                    {/* Removed: 已鎖定使用專屬注音字體 */}
                                </div>
                            </div>
                        </div>

                        {/* 名單管理 */}
                        <div className="bg-[#fcfbf9] p-4 border-2 border-[#5d4037] shadow-hard relative rounded-2xl">
                            <div className="absolute -top-3 left-3 bg-[#c0392b] text-white px-2 text-xs font-mono rounded-full">STUDENTS</div>
                            <div className="mt-2">
                                <div className="flex justify-end gap-2 mb-4">
                                    <button onClick={openBatchEdit} className="text-xs bg-[#f7f1e3] text-retro-ink border-2 border-[#5d4037] px-2 py-1 hover:bg-gray-100 transition-colors font-bold shadow-hard-sm rounded-lg">
                                    批次貼上
                                    </button>
                                    <button onClick={addStudent} className="text-xs bg-[#c0392b] text-white border-2 border-[#8b2e22] px-2 py-1 hover:bg-[#a93226] transition-colors font-bold shadow-hard-sm flex items-center gap-1 rounded-lg">
                                    <Plus className="w-3 h-3" /> 新增
                                    </button>
                                </div>
                                
                                <div className="space-y-2 max-h-[400px] overflow-y-auto retro-scrollbar pr-2">
                                {students.length === 0 ? (
                                    <div className="text-center text-gray-400 py-6 text-sm border-2 border-dashed border-gray-300 font-serif">
                                    名冊空白
                                    </div>
                                ) : (
                                    students.map((s) => (
                                    <div key={s.id} className="flex items-center gap-2 group">
                                        <input 
                                        type="number" 
                                        value={s.id} 
                                        onChange={(e) => updateStudentData(s.id, 'id', e.target.value)} 
                                        className="w-12 h-8 px-1 text-sm border-b-2 border-gray-300 text-center font-mono font-bold bg-transparent focus:border-retro-ink outline-none select-text"
                                        title="座號"
                                        />
                                        <input 
                                        type="text" 
                                        value={s.name} 
                                        onChange={(e) => updateStudentData(s.id, 'name', e.target.value)} 
                                        className="flex-1 h-8 px-2 text-sm border-b-2 border-gray-300 focus:border-retro-ink outline-none bg-transparent font-serif select-text" 
                                        placeholder="姓名"
                                        />
                                        <button 
                                            onClick={(e) => confirmRemoveStudent(e, s.id)} 
                                            className="p-1.5 text-gray-400 hover:text-retro-red transition-colors" 
                                            title="移除"
                                        >
                                            <Trash2 className="w-4 h-4" />
                                        </button>
                                    </div>
                                    ))
                                )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                {/* 批次編輯 Modal */}
                {showBatchEdit && (
                    <div className="fixed inset-0 z-[60] bg-retro-ink/80 flex items-center justify-center p-4">
                    <div className="bg-[#f39c12] p-1 rounded-2xl shadow-2xl w-full max-w-lg transform rotate-1">
                        <div className="bg-retro-paper border-2 border-[#5d4037] p-1 rounded-2xl">
                            <div className="border border-[#5d4037] border-dashed p-4 flex flex-col gap-4 rounded-2xl">
                                <div className="flex justify-between items-center border-b-2 border-[#5d4037] pb-2">
                                    <h3 className="text-lg font-black text-retro-ink font-serif flex items-center gap-2">
                                    <ClipboardList className="w-5 h-5" /> 匯入名單
                                    </h3>
                                    <button onClick={() => setShowBatchEdit(false)}><X className="w-6 h-6 hover:scale-110 transition-transform" /></button>
                                </div>
                                <div className="bg-white border-2 border-retro-ink p-3 shadow-inner-hard">
                                    <p className="text-xs font-mono text-gray-500 mb-2">FORMAT: ID [SPACE] NAME</p>
                                    <textarea 
                                    value={batchInput}
                                    onChange={(e) => setBatchInput(e.target.value)}
                                        className="w-full h-64 outline-none font-mono text-sm resize-none leading-relaxed bg-transparent select-text"
                                    placeholder={`1 王小明\n2 陳大文`}
                                    />
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowBatchEdit(false)} className="px-4 py-2 border-2 border-[#5d4037] text-retro-ink font-bold hover:bg-gray-100 shadow-hard-sm rounded-xl">取消</button>
                                    <button onClick={saveBatchEdit} className="px-4 py-2 bg-[#c0392b] text-white border-2 border-[#8b2e22] font-bold hover:bg-[#a93226] shadow-hard-sm flex items-center gap-2 rounded-xl">
                                    <Save className="w-4 h-4" /> 寫入
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                )}

                {/* 確認視窗 */}
                {confirmConfig.show && (
                    <div className="fixed inset-0 z-[70] bg-retro-ink/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-[#fff176] border-4 border-retro-ink p-6 w-full max-w-sm shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] relative">
                        <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-retro-ink text-[#fff176] px-3 py-1 font-black font-mono tracking-widest border-2 border-white">
                            WARNING
                        </div>
                        <div className="flex flex-col items-center text-center gap-4 mt-2">
                            <AlertTriangle className={`w-12 h-12 ${confirmConfig.type === 'danger' ? 'text-retro-red' : 'text-orange-500'}`} strokeWidth={2} />
                            <h3 className="text-xl font-black font-serif text-retro-ink">{confirmConfig.title}</h3>
                            <p className="text-retro-ink font-medium leading-relaxed font-serif">{confirmConfig.message}</p>
                        </div>
                        <div className="mt-6 flex justify-center gap-4">
                            <button onClick={cancelConfirmAction} className="px-6 py-2 border-2 border-retro-ink font-bold hover:bg-white transition-colors">取消</button>
                            <button 
                            onClick={executeConfirmAction} 
                            className={`px-6 py-2 border-2 border-retro-ink text-white font-bold shadow-hard-sm active:translate-y-1 active:shadow-none transition-all ${confirmConfig.type === 'danger' ? 'bg-retro-red' : 'bg-orange-500'}`}
                            >
                            確認執行
                            </button>
                        </div>
                    </div>
                    </div>
                )}

                {/* 主內容區 */}
                <div ref={splitContainerRef} className="flex-1 flex flex-col lg:flex-row overflow-hidden p-4 gap-4 z-0">
                    
                    {/* 左側面板 (根據 leftPanelMode 切換) */}
                    <div 
                        className={`flex flex-col bg-[#8d6e63] border-4 border-[#5d4037] shadow-2xl relative transition-all duration-300 ${viewMode === 'notebook' ? 'hidden' : ''}`}
                        style={viewMode === 'split' && typeof window !== 'undefined' && window.innerWidth >= 1024 ? { width: `calc(${splitRatio}% - 1rem)`, flex: 'none' } : { flex: 1 }}
                        ref={scrapbookRef}
                    >
                        {/* 軟木塞背景紋理 */}
                        <div className="absolute inset-0 bg-[#b08968] opacity-35 pointer-events-none"></div>

                        {/* 名冊模式：顯示時鐘與名單 */}
                        {leftPanelMode === 'students' && (
                            <>
                                <button
                                    type="button"
                                    onClick={toggleClockStyle}
                                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') toggleClockStyle(); }}
                                    className="flex-none flex flex-col items-center justify-center py-6 border-b-4 shadow-lg relative z-10 cursor-pointer group select-none w-full text-left"
                                    style={{
                                        borderColor: currentClockStyle.ring,
                                        backgroundColor: currentClockStyle.bg
                                    }}
                                    aria-label="切換時鐘顏色"
                                >
                                    <div className="flex items-baseline gap-2">
                                        <span className={`font-mono font-black text-6xl tracking-tighter ${currentClockStyle.text}`} style={{ textShadow: '2px 2px 0px rgba(0,0,0,0.1)', userSelect: 'none', WebkitUserSelect: 'none' }}>
                                            {currentTime.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' })}
                                        </span>
                                        <span className={`text-sm font-bold font-mono animate-pulse ${currentClockStyle.text}`} style={{ userSelect: 'none', WebkitUserSelect: 'none' }}>{currentTime.getSeconds()}</span>
                                    </div>
                                    <div className="flex items-center justify-center gap-4 mt-2 w-full px-4">
                                        <div className="flex items-center gap-2 text-sm font-bold text-retro-ink border border-retro-ink px-3 py-1 bg-white shadow-sm rotate-1">
                                            <Clock className="w-4 h-4" />
                                            <span className="font-mono">遲到線: {lateThreshold}</span>
                                        </div>
                                        <div className={`text-sm font-black px-4 py-1 border-2 border-retro-ink shadow-hard-sm -rotate-1 ${
                                        checkInMode === 'attendance' ? 'bg-retro-paper text-retro-ink' :
                                        checkInMode === 'brushing' ? 'bg-green-100 text-retro-green' :
                                        checkInMode === 'lunch' ? 'bg-orange-100 text-retro-red' : 
                                        checkInMode === 'correction' ? 'bg-blue-100 text-retro-blue' : 'bg-purple-100 text-purple-700'}`}>
                                            {getModeName(checkInMode)}
                                        </div>
                                    </div>
                                </button>
                                <div className="flex-1 p-4 overflow-hidden z-10 h-full relative">
                                    {students.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-full text-[#5d4037]/50 gap-4" onClick={() => setShowSettings(true)}>
                                        <div className="border-4 border-dashed border-[#5d4037]/30 p-8 rounded-full">
                                            <Users className="w-16 h-16" />
                                        </div>
                                        <p className="text-xl font-bold font-serif">尚未建立名冊</p>
                                    </div>
                                    ) : (
                                    <div 
                                        className={`grid ${getGridColsClass()} gap-3 h-full`} 
                                        style={{ fontFamily: currentFontFamily, gridAutoRows: 'minmax(0, 1fr)' }}
                                    >
                                        {students.map((student) => <StudentCard key={student.id} student={student} mode={checkInMode} fontFamily={currentFontFamily} onClick={() => handleStudentClick(student.id)} />)}
                                    </div>
                                    )}
                                </div>
                            </>
                        )}

                        {/* 剪貼簿模式 - 自由拖曳畫布 */}
                        {leftPanelMode === 'scrapbook' && (
                            <div className="flex-1 flex flex-col relative z-10 h-full">
                                {/* 剪貼簿工具列 */}
                                <div className="flex justify-between items-center px-4 py-2 border-b-4 border-[#5d4037] bg-[#fcfbf9]/80 backdrop-blur-sm shadow-md z-30">
                                    <h3 className="font-black text-retro-ink flex items-center gap-2 font-serif">
                                        <Paperclip className="w-4 h-4" /> 班級剪貼簿
                                    </h3>
                                    <div className="flex gap-2">
                                        <input 
                                            type="file" 
                                            ref={fileInputRef} 
                                            onChange={handleImageUpload} 
                                            accept="image/*" 
                                            className="hidden" 
                                        />
                                        <button 
                                            onClick={() => fileInputRef.current.click()}
                                            className="flex items-center gap-1 bg-white border-2 border-retro-ink px-2 py-1 text-xs font-bold shadow-hard-sm hover:translate-y-1 hover:shadow-none transition-all"
                                        >
                                            <Upload className="w-3 h-3" /> 上傳照片
                                        </button>
                                        <button 
                                            onClick={() => setScrapbookImages([])}
                                            className="flex items-center gap-1 bg-retro-red text-white border-2 border-retro-ink px-2 py-1 text-xs font-bold shadow-hard-sm hover:translate-y-1 hover:shadow-none transition-all"
                                        >
                                            <Trash2 className="w-3 h-3" /> 清空
                                        </button>
                                    </div>
                                </div>
                                
                                {/* 圖片展示區 - 使用 overflow-hidden 模擬有限的軟木塞板 */}
                                <div className="flex-1 relative overflow-hidden">
                                    {scrapbookImages.length === 0 ? (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center text-[#5d4037]/40 gap-4 pointer-events-none">
                                            <div className="w-24 h-24 border-4 border-dashed border-[#5d4037]/30 flex items-center justify-center rounded-lg rotate-3">
                                                <ImageIcon className="w-10 h-10" />
                                            </div>
                                            <p className="font-serif text-lg font-bold">這裡空空的...</p>
                                            <p className="text-sm font-mono">按 Ctrl+V 貼上圖片或點擊上傳</p>
                                        </div>
                                    ) : (
                                        scrapbookImages.map((img) => (
                                            <div 
                                                key={img.id} 
                                                className="polaroid absolute group cursor-move"
                                                style={{ 
                                                    left: img.x, 
                                                    top: img.y,
                                                    width: `${200 * (img.scale || 1)}px`, // 應用縮放比例
                                                    transform: `rotate(${img.rotation}deg)`,
                                                    zIndex: interactionState.id === img.id ? 100 : 10
                                                }}
                                                onMouseDown={(e) => onMouseDownMove(e, img.id, img.x, img.y)}
                                            >
                                                <img src={img.src} alt="scrapbook" className="w-full h-auto grayscale-[20%] contrast-125 sepia-[30%] pointer-events-none select-none" />
                                                <div className="mt-2 text-center font-mono text-[10px] text-gray-400 truncate select-none">{img.timestamp}</div>
                                                
                                                {/* 刪除按鈕 */}
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); removeImage(img.id); }}
                                                    className="absolute -top-2 -right-2 bg-retro-red text-white w-6 h-6 rounded-full border-2 border-white shadow-md flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-50 cursor-pointer"
                                                >
                                                    <X className="w-3 h-3" />
                                                </button>

                                                {/* 縮放工具列 */}
                                                <div className="absolute -top-8 right-8 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-50">
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); updateImageScale(img.id, 0.1); }}
                                                        className="bg-white border-2 border-retro-ink w-6 h-6 flex items-center justify-center shadow-sm hover:bg-gray-100"
                                                        title="放大"
                                                    >
                                                        <Plus className="w-3 h-3" />
                                                    </button>
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); updateImageScale(img.id, -0.1); }}
                                                        className="bg-white border-2 border-retro-ink w-6 h-6 flex items-center justify-center shadow-sm hover:bg-gray-100"
                                                        title="縮小"
                                                    >
                                                        <Minus className="w-3 h-3" />
                                                    </button>
                                                </div>

                                                {/* 拖拉縮放控制點 */}
                                                <div 
                                                    className="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize z-50 opacity-0 group-hover:opacity-100"
                                                    onMouseDown={(e) => onMouseDownResize(e, img.id, img.scale || 1)}
                                                >
                                                    <div className="absolute bottom-1 right-1 w-0 h-0 border-b-[8px] border-r-[8px] border-l-[8px] border-l-transparent border-t-transparent border-b-retro-red border-r-retro-red rotate-0"></div>
                                                </div>

                                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-4 h-12 bg-[#f1c40f]/50 rotate-45 backdrop-blur-sm shadow-sm pointer-events-none"></div> {/* 膠帶裝飾 */}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {/* 作業繳交 */}
                        {leftPanelMode === 'homework' && (
                            <div className="flex-1 flex flex-col relative z-10 h-full">
                                <div className="flex justify-between items-center px-4 py-2 border-b-4 border-[#5d4037] bg-[#fcfbf9]/80 backdrop-blur-sm shadow-md z-30">
                                    <h3 className="font-black text-retro-ink flex items-center gap-2 font-serif">
                                        <ClipboardList className="w-4 h-4" /> 作業繳交
                                    </h3>
                                    <button
                                        onClick={clearHomeworkSubmissions}
                                        className="flex items-center gap-1 bg-white border-2 border-retro-ink px-2 py-1 text-xs font-bold shadow-hard-sm hover:translate-y-1 hover:shadow-none transition-all"
                                        disabled={!currentHomework}
                                    >
                                        <Check className="w-3 h-3" /> 清空勾選
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    <div className="bg-white border-2 border-retro-ink shadow-hard p-4 space-y-3">
                                        <div className="text-sm font-black text-retro-ink flex items-center gap-2">
                                            <ClipboardList className="w-4 h-4" /> 新增作業
                                        </div>
                                        <input
                                            type="text"
                                            value={homeworkForm.title}
                                            onChange={(e) => setHomeworkForm(prev => ({ ...prev, title: e.target.value }))}
                                            placeholder="作業名稱"
                                        className="w-full px-3 py-2 border-2 border-retro-ink bg-retro-paper outline-none font-bold select-text"
                                        />
                                        <input
                                            type="date"
                                            value={homeworkForm.dueDate}
                                            onChange={(e) => setHomeworkForm(prev => ({ ...prev, dueDate: e.target.value }))}
                                            className="w-full px-3 py-2 border-2 border-retro-ink bg-retro-paper outline-none font-mono select-text"
                                        />
                                        <textarea
                                            value={homeworkForm.description}
                                            onChange={(e) => setHomeworkForm(prev => ({ ...prev, description: e.target.value }))}
                                            placeholder="作業說明"
                                            className="w-full min-h-24 px-3 py-2 border-2 border-retro-ink bg-retro-paper outline-none resize-none font-serif select-text"
                                        />
                                        <button
                                            onClick={createHomeworkAssignment}
                                            className="w-full py-2 bg-white text-retro-ink border-2 border-retro-ink font-bold hover:bg-gray-100 shadow-hard-sm"
                                        >
                                            新增作業
                                        </button>
                                    </div>

                                    <div className="bg-[#fcfbf9] border-2 border-retro-ink shadow-hard p-4">
                                        <div className="text-sm font-black text-retro-ink mb-3 flex items-center gap-2">
                                            <BookOpen className="w-4 h-4" /> 作業列表
                                        </div>
                                        {homeworkAssignments.length === 0 ? (
                                            <div className="text-center text-gray-400 py-6 text-sm border-2 border-dashed border-gray-300 font-serif">
                                                尚未建立作業
                                            </div>
                                        ) : (
                                            <div className="space-y-2">
                                                {homeworkAssignments.map((item) => (
                                                    <div
                                                        key={item.id}
                                                        role="button"
                                                        tabIndex={0}
                                                        onClick={() => setHomeworkData(prev => ({ ...prev, activeId: item.id }))}
                                                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') setHomeworkData(prev => ({ ...prev, activeId: item.id })); }}
                                                        className={`w-full text-left p-3 border-2 transition-all cursor-pointer ${currentHomework?.id === item.id ? 'border-retro-ink bg-yellow-50 shadow-hard-sm' : 'border-gray-300 bg-white hover:border-retro-ink'}`}
                                                    >
                                                        <div className="flex items-start justify-between gap-2">
                                                            <div>
                                                                <div className="font-bold text-retro-ink">{item.title}</div>
                                                                <div className="text-xs text-gray-500 font-mono">
                                                                    {item.dueDate ? `截止 ${item.dueDate}` : '未設定截止日'}
                                                                </div>
                                                            </div>
                                                            <button
                                                                onClick={(e) => { e.stopPropagation(); removeHomeworkAssignment(item.id); }}
                                                                className="text-retro-red hover:scale-110 transition-transform"
                                                                title="刪除"
                                                            >
                                                                <Trash2 className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                        {item.description ? (
                                                            <div className="mt-2 text-sm text-gray-700 line-clamp-2">{item.description}</div>
                                                        ) : null}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-white border-2 border-retro-ink shadow-hard p-4">
                                        <div className="flex items-center justify-between gap-2 mb-3">
                                            <div className="text-sm font-black text-retro-ink flex items-center gap-2">
                                                <Users className="w-4 h-4" /> 繳交狀態
                                            </div>
                                            <div className="text-xs font-mono text-gray-500">
                                                {currentHomework ? `${submittedCount}/${students.length}` : '0/0'}
                                            </div>
                                        </div>
                                        {currentHomework ? (
                                            students.length === 0 ? (
                                                <div className="text-center text-gray-400 py-6 text-sm border-2 border-dashed border-gray-300 font-serif">
                                                    先建立名冊再勾選
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 gap-2 max-h-[320px] overflow-y-auto retro-scrollbar pr-1">
                                                    {students.map((student) => {
                                                        const done = !!currentHomework.submissions?.[student.id];
                                                        return (
                                                            <button
                                                                key={student.id}
                                                                onClick={() => toggleHomeworkSubmission(student.id)}
                                                                className={`text-left p-2 border-2 transition-all ${done ? 'bg-green-50 border-retro-green text-retro-green' : 'bg-white border-gray-300 hover:border-retro-ink text-retro-ink'}`}
                                                            >
                                                                <div className="flex items-center justify-between gap-2">
                                                                    <div className="font-bold truncate">
                                                                        <span className="font-mono text-xs opacity-60 mr-1">{student.id}</span>
                                                                        {student.name || '未命名'}
                                                                    </div>
                                                                    <div className={`w-5 h-5 border-2 flex items-center justify-center ${done ? 'bg-retro-green border-retro-green text-white' : 'border-gray-300'}`}>
                                                                        {done ? <Check className="w-3 h-3" /> : null}
                                                                    </div>
                                                                </div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            )
                                        ) : (
                                            <div className="text-center text-gray-400 py-6 text-sm border-2 border-dashed border-gray-300 font-serif">
                                                先新增一份作業
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 分隔條 */}
                    {viewMode === 'split' && (
                    <div className="hidden lg:flex w-4 cursor-col-resize items-center justify-center z-30 -ml-2 -mr-2 group" onMouseDown={handleDragStart}>
                        <div className="w-1.5 h-16 bg-[#5d4037] border border-[#3e2723] rounded-full group-hover:bg-[#8d6e63] transition-colors shadow-lg"></div>
                    </div>
                    )}

                    {/* 右側：黑板區 */}
                    <div 
                    className={`flex flex-col relative rounded-sm shadow-2xl overflow-hidden transition-all duration-300 ${viewMode === 'checkin' ? 'hidden' : ''}`}
                    style={viewMode === 'split' && typeof window !== 'undefined' && window.innerWidth >= 1024 ? { width: `calc(${100 - splitRatio}% - 1rem)`, flex: 'none' } : { flex: 1 }}
                    >
                        {/* 實木邊框 */}
                        <div className="absolute inset-0 border-[16px] border-[#3e2723] pointer-events-none z-20 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]"></div>
                        
                        {/* 黑板背景 */}
                        <div className="absolute inset-0 bg-[#263238] z-0">
                             <div className="absolute inset-0 bg-white/5 opacity-30"></div>
                             {/* 粉筆灰髒跡 */}
                             <div className="absolute inset-0 bg-gradient-to-br from-white/5 via-transparent to-white/5 pointer-events-none"></div>
                        </div>

                        {/* 黑板頂部資訊列 */}
                        <div className="relative z-10 flex justify-between items-center p-6 text-gray-200 mt-2">
                            <div className="flex items-center gap-3">
                                <div className="bg-red-600/20 p-2 rounded-full border border-red-500/50">
                                    <Star className="w-6 h-6 text-red-400 fill-red-400/50 animate-pulse" />
                                </div>
                                <h2 className="text-2xl font-black font-serif tracking-widest text-[#eceff1] opacity-90" style={{ textShadow: '1px 1px 2px black' }}>聯絡事項</h2>
                            </div>
                            <div className="flex items-center gap-4 font-mono text-lg text-[#eceff1]">
                                <button onClick={() => setNotebookDate(d => { const n = new Date(d); n.setDate(n.getDate()-1); return n; })} className="hover:text-white hover:scale-125 transition-transform"><ChevronLeft /></button>
                                <span className="border-b-2 border-white/20 px-2">{getNoteDateKey(notebookDate)}</span>
                                <button onClick={() => setNotebookDate(d => { const n = new Date(d); n.setDate(n.getDate()+1); return n; })} className="hover:text-white hover:scale-125 transition-transform"><ChevronRight /></button>
                            </div>
                        </div>

                        {/* 黑板控制按鈕 */}
                        <div className="relative z-10 flex justify-end gap-3 px-6 pb-2 mr-4">
                            <div className="flex items-center bg-[#182326]/80 rounded-sm border border-[#d8c67a]/35 shadow-sm">
                                <button title="縮小黑板文字" aria-label="縮小黑板文字" onClick={() => setNotebookFontSize(p => Math.max(16, p-2))} className="p-1.5 text-[#f7f1d0] hover:bg-[#f4d35e]/20"><Minus size={18} /></button>
                                <span className="text-xs font-mono w-9 text-center text-[#f7f1d0]">{notebookFontSize}</span>
                                <button title="放大黑板文字" aria-label="放大黑板文字" onClick={() => setNotebookFontSize(p => Math.min(72, p+2))} className="p-1.5 text-[#f7f1d0] hover:bg-[#f4d35e]/20"><Plus size={18} /></button>
                            </div>
                            <button title={writingMode === 'horizontal' ? '切換為直式書寫' : '切換為橫式書寫'} aria-label={writingMode === 'horizontal' ? '切換為直式書寫' : '切換為橫式書寫'} onClick={() => setWritingMode(prev => prev === 'horizontal' ? 'vertical' : 'horizontal')} className="p-1.5 text-[#f7f1d0] hover:text-white border border-[#d8c67a]/35 bg-[#182326]/80 hover:bg-[#f4d35e]/20">
                                {writingMode === 'horizontal' ? <AlignVerticalJustifyStart size={20} /> : <AlignHorizontalJustifyStart size={20} />}
                            </button>
                            <button title="清空黑板文字" aria-label="清空黑板文字" onClick={confirmClearNote} className="p-1.5 text-[#ef9f9f] hover:text-[#ffd6d6] border border-[#b46b6b]/45 bg-[#2a2022]/80 hover:bg-[#6d2f2f]/35">
                                <Eraser size={20} />
                            </button>
                            <button title={isEditingNote ? '完成編輯' : '編輯黑板文字'} aria-label={isEditingNote ? '完成編輯' : '編輯黑板文字'} onClick={() => setIsEditingNote(!isEditingNote)} className={`p-1.5 border transition-all ${isEditingNote ? 'bg-[#466c4f]/80 border-[#b8d6b9] text-[#f1fff0]' : 'bg-[#182326]/80 border-[#d8c67a]/35 text-[#f7f1d0] hover:bg-[#f4d35e]/20'}`}>
                                {isEditingNote ? <Check size={20} /> : <Edit3 size={20} />}
                            </button>
                        </div>

                        {/* 書寫區域 */}
                        <div
                        className="flex-1 p-8 relative overflow-hidden z-10 mb-8 mx-4"
                        onMouseMove={(e) => e.stopPropagation()}
                        onMouseUp={(e) => e.stopPropagation()}
                        >
                        {isEditingNote ? (
                            <textarea
                            ref={noteEditorRef}
                            value={currentNoteContent}
                            onChange={(e) => updateCurrentNote(e.target.value)}
                            spellCheck={false}
                            className={`w-full h-full overflow-auto bg-transparent text-white/90 font-serif outline-none resize-none p-4 leading-relaxed tracking-wider border border-white/10 ${writingMode === 'vertical' ? 'writing-vertical' : ''}`}
                            style={{ 
                                fontFamily: currentFontFamily, 
                                fontSize: fontType === 'zhuyin' ? `${notebookFontSize * 1.5}px` : `${notebookFontSize}px`,
                                writingMode: writingMode === 'vertical' ? 'vertical-rl' : 'horizontal-tb',
                                textOrientation: 'mixed',
                                unicodeBidi: 'plaintext',
                                caretColor: '#ffffff'
                            }}
                            placeholder="今日事項..."
                            />
                        ) : (
                            <BlackboardNoteDisplay
                            content={currentNoteContent}
                            writingMode={writingMode}
                            fontType={fontType}
                            notebookFontSize={notebookFontSize}
                            currentFontFamily={currentFontFamily}
                            />
                        )}
                        </div>

                        {/* 粉筆槽裝飾 */}
                        <div className="absolute bottom-4 left-0 right-0 h-4 bg-transparent z-20 px-12 flex items-end gap-8 opacity-80 pointer-events-none">
                            <div className="w-12 h-2 bg-white rounded-full shadow-sm transform rotate-1"></div>
                            <div className="w-8 h-2 bg-red-300 rounded-full shadow-sm transform -rotate-2"></div>
                            <div className="w-20 h-4 bg-[#5d4037] ml-auto rounded-sm border-t border-[#8d6e63]"></div> {/* 板擦 */}
                        </div>
                    </div>
                </div>

                {/* Footer 區塊 */}
                <div className="bg-[#5d4037] py-1 text-center text-[10px] text-[#d7ccc8] font-mono shrink-0 border-t border-[#3e2723] z-50 relative">
                    Classroom routines Created with Google Apps Script & Tailwind CSS
                </div>

                </div>
            );
        };

        // 元件：模式切換按鈕
        const ModeButton = ({ active, onClick, icon, label, color }) => (
                <button onClick={onClick} className={`flex items-center gap-2 px-3 py-1.5 border-2 transition-all shrink-0 font-serif relative overflow-hidden group rounded-lg ${active ? `${color} shadow-hard-sm -translate-y-1` : 'bg-[#fffaf0] border-[#9b8b75] text-[#51463a] hover:bg-[#f7efd9] hover:border-[#5d4037] hover:text-[#2c2418]'}`}>
                {active && <div className="absolute -right-2 -top-2 w-6 h-6 bg-white rotate-45 border border-retro-ink"></div>}
                {icon}
                <span className="text-sm font-bold tracking-wider">{label}</span>
            </button>
        );

        // 元件：工具列按鈕
        const ToolButton = ({ onClick, icon, title, danger }) => (
            <button 
                onClick={onClick} 
                className={`w-12 h-12 inline-flex items-center justify-center border-2 shadow-hard-sm transition-transform active:translate-y-[2px] active:shadow-none bg-[#fcfbf9] rounded-lg ${danger ? 'text-[#a23a2a] border-[#a23a2a] hover:bg-[#f4dfd6]' : 'text-[#2c2418] border-[#2c2418] hover:bg-[#fff4c7]'}`} 
                title={title}
                aria-label={title}
            >
                {icon}
            </button>
        );

        // 元件：學生卡片
        const StudentCard = ({ student, onClick, fontFamily, mode }) => {
            let bgStyle = "bg-[#fffbf0]", 
                borderStyle = "border-gray-300", 
                textStyle = "text-gray-700", 
                stamp = null;

            if (mode === 'attendance') {
                switch (student.status) {
                case 'idle': 
                    bgStyle = "bg-[#fffbf0]"; 
                    borderStyle = "border-gray-300 group-hover:border-retro-ink";
                    textStyle = "text-retro-ink";
                    break; 
                case 'present': 
                    bgStyle = "bg-[#fffbf0]"; 
                    borderStyle = "border-[#c0392b]"; 
                    textStyle = "text-[#c0392b]"; 
                    stamp = (
                        <div className="absolute top-1 right-1 border-2 border-[#c0392b] bg-[#fff7f4] px-1.5 py-0.5 text-[10px] font-black text-[#c0392b] rounded-md shadow-sm rotate-6 animate-stamp">
                            {student.arrivalTime}
                        </div>
                    );
                    break;
                case 'late_absent': 
                    bgStyle = "bg-red-50"; 
                    borderStyle = "border-retro-red border-dashed"; 
                    textStyle = "text-retro-red"; 
                    stamp = <div className="absolute top-1 right-1 text-retro-red opacity-80 animate-bounce"><AlertCircle size={16} /></div>;
                    break;
                case 'late_arrived': 
                    bgStyle = "bg-orange-50"; 
                    borderStyle = "border-[#c0392b]"; 
                    textStyle = "text-[#c0392b]"; 
                    stamp = (
                        <div className="absolute top-1 right-1 border-2 border-[#c0392b] bg-[#fff7f4] px-1.5 py-0.5 text-[10px] font-black text-[#c0392b] rounded-md shadow-sm rotate-6 animate-stamp">
                            LATE {student.arrivalTime}
                        </div>
                    );
                    break;
                }
            } else if (mode === 'brushing' && student.brushing) { 
                bgStyle = "bg-[#eef7ec]";
                borderStyle = "border-[#2f6f4e]";
                textStyle = "text-[#214f36]";
                stamp = <div className="absolute top-0 right-2 bg-[#2f6f4e] text-white text-[10px] px-1 shadow-sm">潔牙</div>;
            }
            else if (mode === 'lunch' && student.lunch) { 
                bgStyle = "bg-[#fff0de]";
                borderStyle = "border-[#9a4d20]";
                textStyle = "text-[#703515]";
                stamp = <div className="absolute top-0 right-2 bg-[#9a4d20] text-white text-[10px] px-1 shadow-sm">午餐</div>;
            }
            else if (mode === 'duty' && student.isDuty) { 
                bgStyle = "bg-purple-50"; borderStyle = "border-purple-400 double-4"; textStyle = "text-purple-700"; 
                stamp = <div className="absolute top-0 right-2 bg-purple-600 text-white text-[10px] px-1 shadow-sm">值日</div>; 
            }
            else if (mode === 'correction' && student.correction) { 
                bgStyle = "bg-[#e6f0f5]";
                borderStyle = "border-[#31566b]";
                textStyle = "text-[#203845]";
                stamp = <div className="absolute top-0 right-2 bg-[#31566b] text-white text-[10px] px-1 shadow-sm">訂正</div>;
            }

            return (
                <button 
                    onClick={onClick} 
                    style={{ containerType: 'size' }}
                    className={`relative w-full h-full min-h-0 flex flex-col items-center justify-center transition-all duration-100 cursor-pointer select-none border-2 p-1 overflow-hidden group shadow-sm active:scale-95 active:shadow-inner ${bgStyle} ${borderStyle} ${textStyle}`}
                >
                <div className="absolute top-1/2 left-1 w-2 h-2 bg-retro-bg rounded-full shadow-inner opacity-40"></div>
                <div className="absolute top-1/2 right-1 w-2 h-2 bg-retro-bg rounded-full shadow-inner opacity-40"></div>
                
                {stamp}

                <span 
                    className="font-bold leading-tight w-full text-center whitespace-nowrap z-10 font-serif" 
                    style={{ 
                        fontFamily, 
                        fontSize: 'clamp(1rem, min(18cqw, 35cqh), 4rem)' 
                    }}
                >
                    <span className="mr-[0.3em] font-mono text-[0.7em] align-middle opacity-50">{student.id}</span>
                    {student.name}
                </span>
                
                <div className="absolute bottom-2 w-3/4 h-[1px] bg-current opacity-10"></div>
                </button>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        (function () {
            function runApp() {
                if (!window.Babel || !window.React || !window.ReactDOM) {
                    setTimeout(runApp, 25);
                    return;
                }
                const source = document.getElementById('app-code');
                if (!source) return;
                const compiled = Babel.transform(source.textContent, {
                    presets: [['react', { runtime: 'classic' }], 'env']
                }).code;
                const script = document.createElement('script');
                script.text = compiled;
                document.body.appendChild(script);
            }
            runApp();
        })();
    </script>
</body>

</html>
